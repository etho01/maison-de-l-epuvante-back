name: SonarQube Analysis

on:
  workflow_call:

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disable shallow clone for better analysis
          fetch-depth: 0
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo, pdo_sqlite
          coverage: xdebug
      
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      
      - name: Install dependencies
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///%kernel.project_dir%/var/data.db
          DEFAULT_URI: http://localhost:8000
          CORS_ALLOW_ORIGIN: '*'
          JWT_PASSPHRASE: test-passphrase
          STRIPE_SECRET_KEY: sk_test_dummy
        run: composer install --prefer-dist --no-progress --no-interaction
      
      - name: Create test environment file
        run: |
          cat > .env.test << 'EOF'
          KERNEL_CLASS='App\Kernel'
          APP_SECRET='test-secret-for-ci'
          SYMFONY_DEPRECATIONS_HELPER=999999
          DATABASE_URL="sqlite:///%kernel.project_dir%/var/test.db"
          CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
          DEFAULT_URI=http://localhost:8000
          FRONTEND_URL=http://localhost:3000
          JWT_PASSPHRASE=test-passphrase-for-ci
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          MAILER_DSN=null://null
          STRIPE_SECRET_KEY=sk_test_mock_key_for_ci
          EOF
      
      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -aes256 -passout pass:test-passphrase-for-ci 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:test-passphrase-for-ci
      
      - name: Clear cache
        run: php bin/console cache:clear --env=test
      
      - name: Run tests with coverage
        run: |
          php bin/phpunit \
            --coverage-clover=coverage.xml \
            --log-junit=junit.xml \
            --colors=never
      
      - name: Fix coverage report paths
        run: |
          # SonarQube needs relative paths, not absolute ones
          sed -i 's|/home/runner/work/[^/]*/[^/]*/||g' coverage.xml || true
      
      - name: Display coverage summary
        run: |
          if [ -f coverage.xml ]; then
            echo "✅ Coverage report generated"
            grep -o 'lines-covered="[^"]*"' coverage.xml | head -1 || echo "Coverage data available"
          else
            echo "⚠️ No coverage report found"
          fi
      
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=maison-de-lepouvante-back
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.php.tests.reportPath=junit.xml
            -Dsonar.verbose=false
      
      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # Optionnel: bloquer le merge si le Quality Gate échoue
        continue-on-error: true
      
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 7
