name: Tests

on:
  workflow_call:

jobs:

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo, pdo_sqlite
          coverage: xdebug
      
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      
      - name: Install dependencies
        env:
          APP_ENV: test
          APP_SECRET: test-secret-for-ci
          DATABASE_URL: sqlite:///%kernel.project_dir%/var/data.db
          DEFAULT_URI: http://localhost:8000
          CORS_ALLOW_ORIGIN: '*'
          JWT_PASSPHRASE: test-passphrase
          STRIPE_SECRET_KEY: sk_test_dummy
        run: composer install --prefer-dist --no-progress --no-interaction
      
      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          KERNEL_CLASS='App\Kernel'
          APP_SECRET='test-secret-for-ci'
          SYMFONY_DEPRECATIONS_HELPER=999999
          DATABASE_URL="sqlite:///%kernel.project_dir%/var/test.db"
          CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
          DEFAULT_URI=http://localhost:8000
          FRONTEND_URL=http://localhost:3000
          JWT_PASSPHRASE=test-passphrase-for-ci
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          MAILER_DSN=null://null
          STRIPE_SECRET_KEY=sk_test_mock_key_for_ci
          EOF
      
      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -aes256 -passout pass:test-passphrase-for-ci 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:test-passphrase-for-ci
      
      - name: Clear cache
        run: php bin/console cache:clear --env=test
      
      - name: Run PHPUnit tests
        run: php bin/phpunit --colors=always
      
      - name: Run PHPUnit tests with coverage
        if: github.event_name == 'pull_request'
        run: php bin/phpunit --coverage-text --coverage-clover=coverage.xml
      
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phpunit-results
          path: var/log/test.log
          if-no-files-found: ignore


