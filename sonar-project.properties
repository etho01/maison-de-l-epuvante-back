# Configuration SonarQube pour Maison de l'Épouvante Backend
sonar.projectKey=maison-de-lepouvante-back
sonar.projectName=Maison de l'Épouvante - Backend API
sonar.projectVersion=1.0.0

# Chemins source et tests
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=\
  **/vendor/**,\
  **/var/**,\
  **/public/**,\
  **/config/**,\
  **/bin/**,\
  **/migrations/**,\
  **/*.xml,\
  **/*.yaml,\
  **/*.yml

# Inclusions des tests
sonar.test.inclusions=\
  tests/**/*Test.php

# PHP settings
sonar.language=php
sonar.php.version=8.2

# Coverage
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git

# Liens
# sonar.links.homepage=https://votre-site.com
# sonar.links.ci=https://github.com/USERNAME/REPO/actions
# sonar.links.scm=https://github.com/USERNAME/REPO
# sonar.links.issue=https://github.com/USERNAME/REPO/issues
